<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ program_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">8周训练计划</p>
          <h1>{{ program_name }}</h1>
        </div>
        <div class="stats" id="stats">
          <div><span id="totalDays">0</span><small>累计打卡</small></div>
          <div><span id="weekRate">0/0</span><small>本周完成</small></div>
          <div><span id="streak">0</span><small>连续天数</small></div>
        </div>
      </section>

      <section class="layout">
        <aside class="calendar-panel">
          <div class="calendar-toolbar">
            <button type="button" class="icon-button" id="prevMonth" aria-label="上个月">‹</button>
            <h2 id="monthTitle"></h2>
            <button type="button" class="icon-button" id="nextMonth" aria-label="下个月">›</button>
          </div>
          <div class="weekdays">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </aside>

        <section class="task-panel">
          <div class="task-header">
            <p id="selectedDate"></p>
            <h2 id="dayTitle"></h2>
          </div>

          <div class="task-columns">
            <section>
              <h3>未完成</h3>
              <div class="task-list" id="pendingList"></div>
            </section>
            <section>
              <h3>已完成</h3>
              <div class="task-list done-list" id="completedList"></div>
            </section>
          </div>
        </section>
      </section>
    </main>

    <dialog id="detailDialog">
      <div class="dialog-head">
        <div>
          <p id="detailStage"></p>
          <h2 id="detailTitle"></h2>
        </div>
        <button type="button" class="icon-button" id="closeDialog" aria-label="关闭">×</button>
      </div>
      <div class="media-stack" id="detailMedia"></div>
      <div id="detailActions"></div>
      <div class="video-links" id="videoLinks"></div>
    </dialog>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
